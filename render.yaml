services:
  - type: web
    name: igas-cms
    runtime: node
    plan: free
    region: ohio
    repo: https://github.com/atulvjd/igas-web
    branch: main
    rootDir: cms
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: DATABASE_CLIENT
        value: postgres
      - key: DATABASE_POOL_MIN
        value: 0
      - key: DATABASE_POOL_MAX
        value: 5
      - key: DATABASE_URL
        sync: false
      - key: UPLOAD_PROVIDER
        value: cloudinary
      - key: CLOUDINARY_NAME
        value: cvmenxou
      - key: CLOUDINARY_KEY
        sync: false
      - key: CLOUDINARY_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://igas-production.vercel.app
      - key: NEXT_APP_URL
        value: https://igas-production.vercel.app
      - key: APP_KEYS
        sync: false
      - key: API_TOKEN_SALT
        generateValue: true
      - key: ADMIN_JWT_SECRET
        generateValue: true
      - key: TRANSFER_TOKEN_SALT
        generateValue: true
      - key: JWT_SECRET
        generateValue: true
      - key: ENCRYPTION_KEY
        generateValue: true
      - key: REVALIDATION_SECRET
        sync: false
